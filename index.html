<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bullet Journal" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />
    <title>Bullet Journal</title>
    <script>
      (function () {
        var accents = {
          violet: 1,
          blue: 1,
          teal: 1,
          green: 1,
          orange: 1,
          rose: 1,
        };
        try {
          var stored = JSON.parse(
            localStorage.getItem("bullet-journal-theme") || '"light"',
          );
          document.documentElement.dataset.theme =
            stored === "dark" ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
        try {
          var accent = JSON.parse(
            localStorage.getItem("bullet-journal-accent") || '"violet"',
          );
          document.documentElement.dataset.accent = accents[accent]
            ? accent
            : "violet";
        } catch (e2) {
          document.documentElement.dataset.accent = "violet";
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
